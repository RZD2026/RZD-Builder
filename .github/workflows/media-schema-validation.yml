name: Media schema validation

on:
  pull_request:
    branches: [master]
    paths:
      - "services/productionMutationPlanBuilders/airtableMediaSchemaPlanBuilder.js"
      - "scripts/testAirtableMediaSchemaPlanBuilder.js"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  media-schema-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated media schema tests
        run: npm run test:media-schema
